name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Generate Clean Project and Compile
        run: |
          # 1. إنشاء مشروع جديد باسم ustexamscall
          flutter create --org com.ust.call --project-name ustexamscall my_app
          cd my_app

          # 2. إعداد pubspec.yaml بالحزم النظيفة
          cat << 'EOF' > pubspec.yaml
          name: ustexamscall
          description: "UST Exams Call"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            permission_handler: ^11.3.1
            network_info_plus: ^5.0.1
            shared_preferences: ^2.2.3

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          # 3. إعداد lib/network_service.dart
          cat << 'EOF' > lib/network_service.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';

          class Peer {
            final String id;
            final String name;
            final String ip;
            final String status;
            DateTime lastSeen;

            Peer({
              required this.id,
              required this.name,
              required this.ip,
              required this.status,
              required this.lastSeen,
            });
          }

          class NetworkService {
            static const int broadcastPort = 45454;
            static const int signalingPort = 45455;

            RawDatagramSocket? _broadcastSocket;
            HttpServer? _signalingServer;
            Timer? _heartbeatTimer;
            Timer? _cleanupTimer;

            final Map<String, Peer> peers = {};
            String myId = '';
            String myName = '';
            String myIp = '';
            String status = 'available';
            String? currentPeerIp;

            Function(Map<String, Peer>)? onPeersUpdated;
            Function(String callerName, String callerIp)? onIncomingCall;
            Function()? onCallAccepted;
            Function(String reason)? onCallRejected;
            Function()? onCallEnded;

            void init(String id, String name, String ip) async {
              myId = id;
              myName = name;
              myIp = ip;

              await _initBroadcast();
              await _initSignaling();

              _heartbeatTimer = Timer.periodic(const Duration(seconds: 2), (_) => _sendBroadcast());
              _cleanupTimer = Timer.periodic(const Duration(seconds: 4), (_) => _cleanupPeers());
            }

            Future<void> _initBroadcast() async {
              try {
                _broadcastSocket = await RawDatagramSocket.bind(InternetAddress.anyIPv4, broadcastPort);
                _broadcastSocket?.broadcastEnabled = true;
                _broadcastSocket?.listen((RawSocketEvent event) {
                  if (event == RawSocketEvent.read) {
                    Datagram? dg = _broadcastSocket?.receive();
                    if (dg != null) {
                      try {
                        String msg = utf8.decode(dg.data);
                        Map<String, dynamic> data = jsonDecode(msg);
                        if (data['id'] != myId) {
                          peers[data['id']] = Peer(
                            id: data['id'],
                            name: data['name'],
                            ip: dg.address.address,
                            status: data['status'] ?? 'available',
                            lastSeen: DateTime.now(),
                          );
                          onPeersUpdated?.call(peers);
                        }
                      } catch (_) {}
                    }
                  }
                });
              } catch (_) {}
            }

            void _sendBroadcast() {
              if (_broadcastSocket == null || myIp.isEmpty) return;
              try {
                final msg = jsonEncode({'id': myId, 'name': myName, 'status': status});
                _broadcastSocket?.send(utf8.encode(msg), InternetAddress('255.255.255.255'), broadcastPort);
              } catch (_) {}
            }

            void _cleanupPeers() {
              final now = DateTime.now();
              peers.removeWhere((key, peer) => now.difference(peer.lastSeen).inSeconds > 5);
              onPeersUpdated?.call(peers);
            }

            Future<void> _initSignaling() async {
              try {
                _signalingServer = await HttpServer.bind(InternetAddress.anyIPv4, signalingPort);
                _signalingServer?.listen((HttpRequest req) async {
                  if (req.method == 'POST') {
                    String body = await utf8.decodeStream(req);
                    Map<String, dynamic> data = jsonDecode(body);
                    String type = data['type'];
                    String senderIp = req.connectionInfo?.remoteAddress.address ?? '';

                    if (type == 'call_request') {
                      if (status == 'busy') {
                        req.response.write(jsonEncode({'response': 'busy'}));
                      } else {
                        currentPeerIp = senderIp;
                        onIncomingCall?.call(data['name'], senderIp);
                        req.response.write(jsonEncode({'response': 'ringing'}));
                      }
                    } else if (type == 'call_action') {
                      if (data['action'] == 'accept') {
                        status = 'busy';
                        onCallAccepted?.call();
                      } else if (data['action'] == 'reject') {
                        _resetCall();
                        onCallRejected?.call('تم رفض المكالمة');
                      } else if (data['action'] == 'end') {
                        _resetCall();
                        onCallEnded?.call();
                      }
                      req.response.write(jsonEncode({'status': 'ok'}));
                    }
                    await req.response.close();
                  }
                });
              } catch (_) {}
            }

            Future<void> call(String targetIp) async {
              currentPeerIp = targetIp;
              try {
                HttpClient client = HttpClient();
                client.connectionTimeout = const Duration(seconds: 4);
                HttpClientRequest req = await client.post(targetIp, signalingPort, '/');
                req.write(jsonEncode({'type': 'call_request', 'name': myName}));
                HttpClientResponse res = await req.close();
                String reply = await utf8.decodeStream(res);
                Map<String, dynamic> data = jsonDecode(reply);

                if (data['response'] == 'busy') {
                  _resetCall();
                  onCallRejected?.call('الطرف الآخر مشغول');
                }
              } catch (_) {
                _resetCall();
                onCallRejected?.call('تعذر الاتصال بالطرف الآخر');
              }
            }

            void acceptCall() {
              if (currentPeerIp == null) return;
              status = 'busy';
              _sendAction(currentPeerIp!, 'accept');
            }

            void rejectCall() {
              if (currentPeerIp == null) return;
              _sendAction(currentPeerIp!, 'reject');
              _resetCall();
            }

            void endCall() {
              if (currentPeerIp != null) {
                _sendAction(currentPeerIp!, 'end');
              }
              _resetCall();
              onCallEnded?.call();
            }

            Future<void> _sendAction(String targetIp, String action) async {
              try {
                HttpClient client = HttpClient();
                client.connectionTimeout = const Duration(seconds: 3);
                HttpClientRequest req = await client.post(targetIp, signalingPort, '/');
                req.write(jsonEncode({'type': 'call_action', 'action': action}));
                await req.close();
              } catch (_) {}
            }

            void _resetCall() {
              status = 'available';
              currentPeerIp = null;
            }

            void dispose() {
              _heartbeatTimer?.cancel();
              _cleanupTimer?.cancel();
              _broadcastSocket?.close();
              _signalingServer?.close();
            }
          }
          EOF

          # 4. إعداد lib/main.dart (شاشات Ustexamscall مع هوية مبنى فرع الحديدة)
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:network_info_plus/network_info_plus.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'network_service.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: UstExamsCallApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class UstExamsCallApp extends StatefulWidget {
            const UstExamsCallApp({super.key});

            @override
            State<UstExamsCallApp> createState() => _UstExamsCallAppState();
          }

          class _UstExamsCallAppState extends State<UstExamsCallApp> {
            final NetworkService _networkService = NetworkService();
            String? myId;
            String? myName;
            String? myIp;
            bool isRegistered = false;

            Map<String, Peer> activePeers = {};

            final Color brickRed = const Color(0xFF8B1E1E);
            final Color royalBlue = const Color(0xFF1A237E);

            @override
            void initState() {
              super.initState();
              _checkPermissionsAndData();
            }

            Future<void> _checkPermissionsAndData() async {
              await [
                Permission.microphone,
                Permission.location,
                Permission.nearbyWifiDevices,
              ].request();

              final prefs = await SharedPreferences.getInstance();
              myId = prefs.getString('user_id');
              myName = prefs.getString('user_name');

              final info = NetworkInfo();
              myIp = await info.getWifiIP();

              if (myId != null && myName != null && myIp != null) {
                setState(() => isRegistered = true);
                _startServices();
              }
            }

            void _startServices() {
              _networkService.init(myId!, myName!, myIp!);

              _networkService.onPeersUpdated = (peers) {
                if (mounted) setState(() => activePeers = Map.from(peers));
              };

              _networkService.onIncomingCall = (callerName, callerIp) {
                _showIncomingCallDialog(callerName);
              };

              _networkService.onCallRejected = (msg) {
                if (Navigator.of(context).canPop()) {
                  Navigator.of(context, rootNavigator: true).pop();
                }
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(msg)));
              };

              _networkService.onCallAccepted = () {
                if (Navigator.of(context).canPop()) {
                  Navigator.of(context, rootNavigator: true).pop();
                }
                _showActiveCallDialog();
              };

              _networkService.onCallEnded = () {
                if (Navigator.of(context).canPop()) {
                  Navigator.of(context, rootNavigator: true).pop();
                }
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('انتهت المكالمة')));
              };
            }

            void _showIncomingCallDialog(String callerName) {
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: const Text('مكالمة اختبارات واردة', textAlign: TextAlign.right),
                  content: Text('$callerName يتصل بك...', textAlign: TextAlign.right),
                  actions: [
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.red),
                      onPressed: () {
                        _networkService.rejectCall();
                        Navigator.pop(ctx);
                      },
                      child: const Text('رفض', style: TextStyle(color: Colors.white)),
                    ),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                      onPressed: () {
                        _networkService.acceptCall();
                        Navigator.pop(ctx);
                        _showActiveCallDialog();
                      },
                      child: const Text('رد', style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );
            }

            void _showActiveCallDialog() {
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  title: const Text('مكالمة جارية', textAlign: TextAlign.right),
                  content: const Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Icon(Icons.wifi_calling_3, size: 50, color: Colors.green),
                      SizedBox(height: 10),
                      Text('جاري التحدث عبر شبكة الامتحانات المحلية...', textAlign: TextAlign.center),
                    ],
                  ),
                  actions: [
                    Center(
                      child: ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.red),
                        onPressed: () => _networkService.endCall(),
                        child: const Text('إنهاء المكالمة', style: TextStyle(color: Colors.white)),
                      ),
                    )
                  ],
                ),
              );
            }

            @override
            void dispose() {
              _networkService.dispose();
              super.dispose();
            }

            Widget _buildAppIconBadge() {
              return Container(
                width: 85,
                height: 85,
                decoration: BoxDecoration(
                  gradient: LinearGradient(
                    colors: [brickRed, royalBlue],
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                  ),
                  borderRadius: BorderRadius.circular(22),
                  boxShadow: [
                    BoxShadow(
                      color: brickRed.withOpacity(0.35),
                      blurRadius: 10,
                      offset: const Offset(0, 4),
                    ),
                  ],
                  border: Border.all(color: Colors.white, width: 2),
                ),
                child: const Center(
                  child: Icon(Icons.wifi_calling_3_rounded, color: Colors.white, size: 45),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              if (!isRegistered) {
                return Scaffold(
                  appBar: AppBar(
                    title: const Text('Ustexamscall - فرع الحديدة', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 17)),
                    centerTitle: true,
                    backgroundColor: royalBlue,
                  ),
                  body: Container(
                    decoration: BoxDecoration(
                      gradient: LinearGradient(
                        begin: Alignment.topCenter,
                        end: Alignment.bottomCenter,
                        colors: [royalBlue.withOpacity(0.06), Colors.white],
                      ),
                    ),
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 20.0, vertical: 25),
                      child: Column(
                        children: [
                          _buildAppIconBadge(),
                          const SizedBox(height: 12),
                          Text(
                            'جامعة العلوم والتكنولوجيا - فرع الحديدة',
                            style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: royalBlue),
                          ),
                          const SizedBox(height: 4),
                          const Text(
                            'نظام الاتصال الداخلي الصوتي للجان الامتحانات',
                            style: TextStyle(fontSize: 12, color: Colors.black54),
                          ),
                          const SizedBox(height: 25),
                          TextField(
                            textAlign: TextAlign.right,
                            decoration: InputDecoration(
                              labelText: 'الاسم (مثل: قاعة 1 / الكنترول)',
                              filled: true,
                              fillColor: Colors.white,
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(10)),
                              prefixIcon: Icon(Icons.person_pin, color: brickRed),
                            ),
                            onChanged: (val) => myName = val,
                          ),
                          const SizedBox(height: 15),
                          TextField(
                            textAlign: TextAlign.right,
                            decoration: InputDecoration(
                              labelText: 'الرقم الداخلي (مثل: 101)',
                              filled: true,
                              fillColor: Colors.white,
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(10)),
                              prefixIcon: Icon(Icons.tag, color: brickRed),
                            ),
                            keyboardType: TextInputType.number,
                            onChanged: (val) => myId = val,
                          ),
                          const SizedBox(height: 20),
                          SizedBox(
                            width: double.infinity,
                            height: 48,
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: royalBlue,
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                              ),
                              onPressed: () async {
                                if (myName != null && myId != null && myName!.trim().isNotEmpty && myId!.trim().isNotEmpty) {
                                  final prefs = await SharedPreferences.getInstance();
                                  await prefs.setString('user_id', myId!.trim());
                                  await prefs.setString('user_name', myName!.trim());
                                  final info = NetworkInfo();
                                  myIp = await info.getWifiIP();
                                  if (myIp != null) {
                                    setState(() => isRegistered = true);
                                    _startServices();
                                  } else {
                                    ScaffoldMessenger.of(context).showSnackBar(
                                      const SnackBar(content: Text('يرجى التأكد من الاتصال بشبكة Wi-Fi أولاً')),
                                    );
                                  }
                                }
                              },
                              child: const Text('دخول إلى الشبكة', style: TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold)),
                            ),
                          ),
                          const Spacer(),
                          Container(
                            padding: const EdgeInsets.symmetric(vertical: 6, horizontal: 16),
                            decoration: BoxDecoration(
                              color: brickRed,
                              borderRadius: BorderRadius.circular(20),
                            ),
                            child: const Text(
                              'تصميم وتطوير: م/ عبدالرزاق عزي',
                              style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: Colors.white),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                );
              }

              return Scaffold(
                appBar: AppBar(
                  backgroundColor: royalBlue,
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('Ustexamscall: $myName ($myId)', style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                      Text('IP: $myIp | فرع الحديدة', style: const TextStyle(fontSize: 11, color: Colors.white70)),
                    ],
                  ),
                ),
                body: Container(
                  color: const Color(0xFFF7F8FA),
                  child: Column(
                    children: [
                      Expanded(
                        child: activePeers.isEmpty
                            ? Center(
                                child: Column(
                                  mainAxisAlignment: MainAxisAlignment.center,
                                  children: [
                                    CircularProgressIndicator(color: brickRed),
                                    const SizedBox(height: 15),
                                    const Text(
                                      'جاري البحث عن لجان ومتصلين في الشبكة...',
                                      style: TextStyle(fontWeight: FontWeight.bold, color: Colors.black54),
                                    ),
                                  ],
                                ),
                              )
                            : ListView.builder(
                                itemCount: activePeers.values.length,
                                itemBuilder: (context, index) {
                                  final peer = activePeers.values.elementAt(index);
                                  final bool isBusy = peer.status == 'busy';

                                  return Card(
                                    margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                    elevation: 2,
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                                    child: ListTile(
                                      leading: CircleAvatar(
                                        backgroundColor: isBusy ? Colors.red : Colors.green,
                                        child: Icon(isBusy ? Icons.phone_locked : Icons.person, color: Colors.white),
                                      ),
                                      title: Text('${peer.name} (${peer.id})', style: TextStyle(fontWeight: FontWeight.bold, color: royalBlue)),
                                      subtitle: Text('IP: ${peer.ip} | الحالة: ${isBusy ? "مشغول" : "متاح"}'),
                                      trailing: IconButton(
                                        icon: const Icon(Icons.call, color: Colors.green, size: 28),
                                        onPressed: isBusy
                                            ? null
                                            : () {
                                                _networkService.call(peer.ip);
                                                showDialog(
                                                  context: context,
                                                  barrierDismissible: false,
                                                  builder: (ctx) => AlertDialog(
                                                    content: Text('جاري الاتصال بـ ${peer.name}...'),
                                                    actions: [
                                                      TextButton(
                                                        onPressed: () {
                                                          _networkService.endCall();
                                                          Navigator.pop(ctx);
                                                        },
                                                        child: const Text('إلغاء'),
                                                      )
                                                    ],
                                                  ),
                                                );
                                              },
                                      ),
                                    ),
                                  );
                                },
                              ),
                      ),
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(vertical: 8),
                        color: brickRed,
                        child: const Text(
                          'جامعة العلوم والتكنولوجيا - فرع الحديدة | تطوير: م/ عبدالرزاق عزي',
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            fontSize: 11,
                            fontWeight: FontWeight.bold,
                            color: Colors.white,
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 5. تعديل اسم التطبيق المعروض في أندرويد
          sed -i 's/android:label="ustexamscall"/android:label="Ustexamscall"/g' android/app/src/main/AndroidManifest.xml

          # 6. تثبيت الحزم وبناء ملف الـ APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 7. تصدير ملف APK
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Deliver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ustexamscall-Release
          path: output/app-release.apk
