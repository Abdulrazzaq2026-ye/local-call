name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Generate and Build
        run: |
          # 1. نسخ ملفات الكود
          mkdir -p /tmp/my_code
          cp -r lib /tmp/my_code/
          cp pubspec.yaml /tmp/my_code/

          # 2. إنشاء بيئة فلاتر نظيفة
          cd ..
          flutter create --org com.ust.localcall --project-name local_call fresh_project
          cd fresh_project

          # 3. نقل كودك الخاص
          cp -rf /tmp/my_code/lib/* lib/
          cp -f /tmp/my_code/pubspec.yaml pubspec.yaml

          # 4. تنزيل الحزم
          flutter pub get

          # 5. بناء التطبيق وتجاوز مشاكل الأيقونات
          flutter build apk --release --no-tree-shake-icons

          # 6. تجهيز المخرجات
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Deliver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UST-LocalCall-Release
          path: output/app-release.apk
