name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Recreate Android structure safely
        run: |
          # حفظ الملفات الأساسية
          cp pubspec.yaml pubspec_backup.yaml
          cp android/app/src/main/AndroidManifest.xml manifest_backup.xml
          
          # تهيئة مجلد أندرويد
          flutter create --platforms=android .
          
          # استعادة الملفات المضبوطة
          mv pubspec_backup.yaml pubspec.yaml
          mv manifest_backup.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalCall-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
