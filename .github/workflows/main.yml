name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Generate Clean Project and Compile
        run: |
          # 1. إنشاء تطبيق فلاتر جديد باسم ustexamscall
          cd ..
          flutter create --org com.ust.call --project-name ustexamscall fresh_project
          cd fresh_project

          # 2. حذف ملفات العرض التجريبية الافتراضية بالكامل لضمان الإقلاع على برنامجك
          rm -rf lib/*

          # 3. نسخ كود المشروع الحقيقي و pubspec
          cp -f $GITHUB_WORKSPACE/lib/main.dart lib/main.dart
          cp -f $GITHUB_WORKSPACE/lib/network_service.dart lib/network_service.dart
          cp -f $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml

          # 4. ضبط اسم التطبيق الظاهر في شاشة الهاتف الرئيسية
          sed -i 's/android:label="ustexamscall"/android:label="Ustexamscall"/g' android/app/src/main/AndroidManifest.xml

          # 5. تنزيل الحزم وتجميع الـ APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 6. تجهيز ملف التحميل النهائي
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Deliver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ustexamscall-Release
          path: output/app-release.apk
