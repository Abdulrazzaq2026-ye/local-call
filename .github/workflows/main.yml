name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter Project from Scratch
        run: |
          # حفظ ملفاتك الخاصة
          mkdir -p /tmp/my_source
          cp -r lib /tmp/my_source/
          cp pubspec.yaml /tmp/my_source/
          cp android/app/src/main/AndroidManifest.xml /tmp/my_source/AndroidManifest.xml

          # إنشاء مشروع فلاتر كامل ونظيف
          cd ..
          flutter create --org com.local --project-name local_call app_build
          cd app_build

          # استبدال الملفات بملفاتك الخاصة
          cp -rf /tmp/my_source/lib/* lib/
          cp -f /tmp/my_source/pubspec.yaml pubspec.yaml
          cp -f /tmp/my_source/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # تنزيل الحزم والبناء
          flutter pub get
          flutter build apk --release

          # نقل ملف الـ APK النهائي
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalCall-Release-APK
          path: output/app-release.apk
