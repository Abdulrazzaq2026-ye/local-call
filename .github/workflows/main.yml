name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Project and Compile
        run: |
          # 1. نسخ كود التطبيق في مسار مؤقت
          mkdir -p /tmp/my_code
          cp -r lib /tmp/my_code/
          cp pubspec.yaml /tmp/my_code/

          # 2. إنشاء مشروع Flutter رسمي قياسي متكامل
          cd ..
          flutter create --org com.ust.localcall --project-name local_call fresh_project
          cd fresh_project

          # 3. إحلال ملفاتك البرمجية مكان الافتراضية
          cp -rf /tmp/my_code/lib/* lib/
          cp -f /tmp/my_code/pubspec.yaml pubspec.yaml

          # 4. إدراج أذونات الشبكة في AndroidManifest تلقائياً
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"/>' android/app/src/main/AndroidManifest.xml

          # 5. تنزيل الحزم وتجميع الـ APK
          flutter pub get
          flutter build apk --release

          # 6. نقل الملف النهائي لمنطقة التحميل
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Deliver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UST-LocalCall-Release
          path: output/app-release.apk
