name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter Project
        run: |
          # 1. حفظ ملفات كودك
          mkdir -p /tmp/my_source
          cp -r lib /tmp/my_source/
          cp pubspec.yaml /tmp/my_source/
          cp android/app/src/main/AndroidManifest.xml /tmp/my_source/AndroidManifest.xml

          # 2. إنشاء مشروع نظيف
          cd ..
          flutter create --org com.local --project-name local_call app_build
          cd app_build

          # 3. استرجاع ملفاتك
          cp -rf /tmp/my_source/lib/* lib/
          cp -f /tmp/my_source/pubspec.yaml pubspec.yaml
          cp -f /tmp/my_source/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # 4. تعديل minSdkVersion إلى 23 تلقائياً سواء كان الملف gradle أو kts
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} +

          # 5. تنزيل المكتبات وبناء الـ APK
          flutter pub get
          flutter build apk --release

          # 6. نقل ملف الـ APK لمجلد الإخراج
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalCall-Release-APK
          path: output/app-release.apk
